<section class="p-4">
  <h2 class="text-2xl font-bold mb-4">Skills</h2>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    @for (skill of skills; track skill.name) {
      <div
        class="flex flex-col items-center justify-center p-4 border rounded-lg shadow-sm hover:shadow-md transition"
      >
        <img [src]="skill.iconUrl" [alt]="skill.name" class="w-12 h-12 mb-2" loading="lazy" />
        <span class="font-medium text-sm">{{ skill.name }}</span>
      </div>
    }
  </div>
</section>
