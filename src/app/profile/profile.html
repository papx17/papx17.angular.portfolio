<section class="container-2xl border-2 rounded my-3">
  <header
    class="row flex-col-reverse md:flex-row sm:flex-col-reverse p-3 align-items-center justify-items-around rounded"
  >
    <div class="col-sm-12 col-md-6 text-center justify-items-center">
      <h1 class="text-3xl md:text-4xl">Jose Miguel Apicello Escobar</h1>
      <h5 class="text-xl md:text-2xl">Desarrollador FullStack</h5>
      <nav class="nav navig justify-content-center">
        <ul class="row justify-content-around p-3">
          <li class="col-3 text-2xl md:text-4xl cursor-pointer" (click)="openWindow('linkedin')">
            <i class="fa fa-linkedin rounded"></i>
          </li>
          <li class="col-3 text-2xl md:text-4xl cursor-pointer" (click)="openWindow('mail')">
            <i class="fa-regular fa-envelope rounded"></i>
          </li>
          <li class="col-3 text-2xl md:text-4xl cursor-pointer" (click)="openWindow('whatsapp')">
            <i class="fa fa-whatsapp rounded"></i>
          </li>
          <li class="col-3 text-2xl md:text-4xl cursor-pointer" (click)="openWindow('discord')">
            <i class="fa-brands fa-discord rounded"></i>
          </li>
        </ul>
      </nav>
    </div>
    <section class="col-sm-12 col-md-6 justify-items-center">
      <div class="image_container h-25 w-25 md:h-50 md:w-50 round">
        <img class="rounded-circle" src="profile.jpg" alt="profile-img" />
      </div>
    </section>
  </header>
</section>
